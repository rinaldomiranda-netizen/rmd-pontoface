<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#102f24" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="PontoFace" />
  <link rel="manifest" href="/manifest.webmanifest" id="app-manifest" />
  <link rel="apple-touch-icon" href="/icon.svg" />
  <link rel="icon" href="/icon.svg" />
  <link rel="stylesheet" href="/mobile-dashboard-fix.css" />
  <script>
    // Select the correct static PWA manifest before the app boots.
    // This is important on Android: dynamically replacing the manifest after
    // React loads can prevent beforeinstallprompt from firing on employee links.
    (function () {
      var p = window.location.pathname;
      var manifest = p.indexOf('/funcionario/') === 0 || p === '/funcionario'
        ? '/manifest-funcionario.webmanifest'
        : p.indexOf('/admin') === 0
          ? '/manifest-empresa.webmanifest'
          : p.indexOf('/rmd') === 0
            ? '/manifest-rmd.webmanifest'
            : '/manifest.webmanifest';
      var link = document.getElementById('app-manifest');
      if (link) link.href = manifest;
    })();
  </script>
  <title>RMD PontoFace</title>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
