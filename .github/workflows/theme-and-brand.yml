name: Theme and brand identities

on:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  visual-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Keep committed visual layout intact
        run: |
          test -f public/mobile-dashboard-fix.css
          test -f src/pages/AdminDashboard.tsx
          test -f src/styles.css
          echo "Visual files are committed and are not rewritten by this workflow."
