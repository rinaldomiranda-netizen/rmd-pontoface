name: PWA professional icon

# Desligado em 26/09/2026: este robô reescrevia o código a cada push e desfazia mudanças do painel.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  icon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Update runtime PWA icon references
        shell: python
        run: |
          from pathlib import Path
          for filename in ['src/main.tsx', 'src/lib/pwaInstall.ts']:
              p = Path(filename)
              s = p.read_text(encoding='utf-8')
              s = s.replace('/icon-192.png', '/icon-192.svg').replace('/icon-512.png', '/icon-512.svg')
              s = s.replace("type: 'image/png'", "type: 'image/svg+xml'")
              s = s.replace("type: 'image/png'", "type: 'image/svg+xml'")
              p.write_text(s, encoding='utf-8')
      - name: Commit icon references
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/main.tsx src/lib/pwaInstall.ts
          git commit -m "fix: use professional PWA icon"
          git push
