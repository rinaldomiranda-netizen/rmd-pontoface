name: Fix company entry alerts placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Ensure entry alert placement
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/pages/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          # The alert component must exist exactly once and must only show
          # genuine late-entry alerts (positive minutes_delta).
          if 'function CompanyEntryAlerts' not in s:
              marker = '/* ---------------------------- Attendance ---------------------------- */'
              component = '''function CompanyEntryAlerts({ alerts }: { alerts: any[] }) {\n  const entryAlerts = (alerts || []).filter((a: any) => {\n    const message = String(a?.message || '').toLowerCase();\n    const type = String(a?.alert_type || a?.type || '').toLowerCase();\n    const delta = Number(a?.minutes_delta);\n    return (type.includes('late') || type.includes('entry') || message.includes('entrada') || message.includes('atras')) && delta > 0;\n  }).slice(0, 5);\n  if (!entryAlerts.length) return null;\n  return (\n    <div className=\"card\" style={{ border: '1px solid #e2b65c', background: '#fff8df', marginBottom: 14 }}>\n      <h2 style={{ marginBottom: 8 }}>⚠ Alertas de entrada</h2>\n      {entryAlerts.map((a: any) => (\n        <div key={a.id} style={{ padding: '9px 0', borderBottom: '1px solid #ead99c' }}>\n          <b>{a.employees?.full_name || a.employee_name_snapshot || 'Funcionário'}</b>\n          <div style={{ marginTop: 3 }}>{a.message}</div>\n          <div className=\"tag danger\" style={{ marginTop: 4 }}>Atraso na entrada: {Math.round(Math.max(0, Number(a.minutes_delta) || 0))} min</div>\n        </div>\n      ))}\n    </div>\n  );\n}\n\n'''
              s = s.replace(marker, component + marker, 1)

          # Ensure both intended screens receive the alert data.
          s = s.replace(
              "{section === 'overview' && <Overview companyId={companyId} />}",
              "{section === 'overview' && <Overview companyId={companyId} companyAlerts={companyAlerts} />}", 1
          )
          s = s.replace(
              "{section === 'attendance' && <Attendance companyId={companyId} role={role} />}",
              "{section === 'attendance' && <Attendance companyId={companyId} role={role} companyAlerts={companyAlerts} />}", 1
          )

          # Insert the alert immediately inside Attendance's top-level return.
          # Regex is used so harmless formatting changes cannot make this patch miss.
          if 'function Attendance({ companyId, role, companyAlerts' not in s:
              s = s.replace(
                  'function Attendance({ companyId, role }: { companyId: string; role: string }) {',
                  'function Attendance({ companyId, role, companyAlerts }: { companyId: string; role: string; companyAlerts: any[] }) {', 1
              )

          marker = 'function Attendance({ companyId, role, companyAlerts }: { companyId: string; role: string; companyAlerts: any[] }) {'
          pos = s.find(marker)
          if pos >= 0:
              ret = s.find('  return (', pos)
              if ret >= 0:
                  div = s.find('    <div>', ret)
                  if div >= 0 and div < s.find('/* ----------------------------', ret + 10):
                      insert = '      <CompanyEntryAlerts alerts={companyAlerts} />\n'
                      after_div = div + len('    <div>\n')
                      if insert not in s[ret:after_div + 200]:
                          s = s[:after_div] + insert + s[after_div:]

          p.write_text(s, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx .github/workflows/fix-attendance-live.yml
          git commit -m "fix: show entry alert on dashboard and attendance"
          git push
