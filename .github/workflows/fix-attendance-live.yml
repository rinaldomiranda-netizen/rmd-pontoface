name: Fix attendance live refresh

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch attendance display and refresh
        shell: python
        run: |
          from pathlib import Path

          p = Path('src/pages/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          old = "  const [loading, setLoading] = React.useState(false);\n  const canReset = ['owner', 'admin', 'hr'].includes(role);"
          new = "  const [loading, setLoading] = React.useState(true);\n  const initialLoadRef = React.useRef(true);\n  const canReset = ['owner', 'admin', 'hr'].includes(role);"
          if old in s and 'initialLoadRef' not in s:
              s = s.replace(old, new, 1)

          old = "  async function load() {\n    setLoading(true);\n    const start = new Date(date + 'T00:00:00');"
          new = "  async function load() {\n    const firstLoad = initialLoadRef.current;\n    if (firstLoad) setLoading(true);\n    const start = new Date(date + 'T00:00:00');"
          if old in s:
              s = s.replace(old, new, 1)

          old = "    setAllRecords(historyRows || []);\n    setLoading(false);\n  }\n\n  const selectedWeekday"
          new = "    setAllRecords(historyRows || []);\n    if (firstLoad) {\n      initialLoadRef.current = false;\n      setLoading(false);\n    }\n  }\n\n  const selectedWeekday"
          if old in s:
              s = s.replace(old, new, 1)

          old = ".select('employee_id,weekday,enabled,morning_enabled,afternoon_enabled').eq('company_id', companyId)"
          new = ".select('employee_id,weekday,enabled,morning_enabled,afternoon_enabled,entry_time,exit_time').eq('company_id', companyId)"
          if old in s:
              s = s.replace(old, new, 1)

          old = "          const balance = item.rows.length ? Number(item.rows[item.rows.length-1].balance_minutes || 0) : 0;\n          const completed = item.rows.length;"
          new = "          const completed = item.rows.length;\n          const firstEntry = item.rows.find((r:any) => r.punch_type === 'entry');\n          const scheduledEntry = item.schedule?.entry_time || null;\n          let entryDelta: number | null = null;\n          if (firstEntry && scheduledEntry) {\n            const [sh, sm] = String(scheduledEntry).slice(0,5).split(':').map(Number);\n            const dt = new Date(firstEntry.occurred_at);\n            const actualMinutes = dt.getHours() * 60 + dt.getMinutes();\n            const scheduledMinutes = sh * 60 + sm;\n            entryDelta = actualMinutes - scheduledMinutes;\n          }"
          if old in s:
              s = s.replace(old, new, 1)

          old = "                <div style={{fontWeight:800,color:balance<0?'var(--danger)':balance>0?'var(--brand-2)':'inherit'}}>\n                  Saldo do dia: {balance>0?'+':''}{balance} min\n                </div>\n                <div style={{fontWeight:800,color:item.totalBalance<0?'var(--danger)':item.totalBalance>0?'var(--brand-2)':'inherit'}}>\n                  Saldo acumulado: {item.totalBalance>0?'+':''}{Math.round(item.totalBalance)} min\n                </div>"
          new = "                {entryDelta !== null && entryDelta !== 0 && (\n                  <div style={{fontWeight:800,color:entryDelta>0?'var(--danger)':'var(--brand-2)'}}>\n                    {entryDelta > 0 ? 'Atraso na entrada: ' + entryDelta + ' min' : 'Entrada antecipada: +' + Math.abs(entryDelta) + ' min'}\n                  </div>\n                )}"
          if old in s:
              s = s.replace(old, new, 1)
          p.write_text(s, encoding='utf-8')

          p2 = Path('src/pages/EmployeePunch.tsx')
          e = p2.read_text(encoding='utf-8')

          old = "              <div style={{ marginTop: 3, color: Number(dashboard.today.balance) < 0 ? 'var(--danger)' : 'var(--brand-2)', fontWeight: 800 }}>\n                Saldo: {dashboard.today.balance == null ? '0 min' : (Number(dashboard.today.balance) > 0 ? '+' : '') + Math.round(Number(dashboard.today.balance)) + ' min'}\n              </div>"
          new = "              {(() => {\n                const firstEntry = (Array.isArray(dashboard.today?.rows) ? dashboard.today.rows : []).find((r:any) => r.punch_type === 'entry');\n                const scheduled = dashboard.today?.schedule?.entry_time;\n                if (!firstEntry || !scheduled) return null;\n                const [sh, sm] = String(scheduled).slice(0,5).split(':').map(Number);\n                const dt = new Date(firstEntry.occurred_at);\n                const delta = (dt.getHours() * 60 + dt.getMinutes()) - (sh * 60 + sm);\n                if (!delta) return null;\n                return <div style={{ marginTop: 3, color: delta > 0 ? 'var(--danger)' : 'var(--brand-2)', fontWeight: 800 }}>{delta > 0 ? 'Atraso na entrada: ' + delta + ' min' : 'Entrada antecipada: +' + Math.abs(delta) + ' min'}</div>;\n              })()}"
          if old in e:
              e = e.replace(old, new, 1)

          old = "              const balance = Number(h.balance_minutes ?? 0);\n              return ("
          new = "              return ("
          if old in e:
              e = e.replace(old, new, 1)

          old = "                  {h.balance_minutes != null && balance !== 0 && (\n                    <div style={{ marginTop: 3, color: balance < 0 ? 'var(--danger)' : 'var(--brand-2)', fontWeight: 800 }}>\n                      Saldo {balance > 0 ? '+' : ''}{Math.round(balance)} min\n                    </div>\n                  )}"
          if old in e:
              e = e.replace(old, '', 1)

          old = "        const balance = Number(data.balance_minutes ?? 0);\n        const saldo = balance > 0 ? ' • Saldo +' + Math.round(balance) + ' min' : balance < 0 ? ' • Faltam ' + Math.abs(Math.round(balance)) + ' min' : '';\n        setMessage(`Ponto confirmado às ${new Date(currentPunch.occurred_at).toLocaleTimeString('pt-BR')}${loc ? ' — ' + loc : ''}.${saldo}`);"
          new = "        setMessage(`Ponto confirmado às ${new Date(currentPunch.occurred_at).toLocaleTimeString('pt-BR')}${loc ? ' — ' + loc : ''}.`);"
          if old in e:
              e = e.replace(old, new, 1)

          p2.write_text(e, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx src/pages/EmployeePunch.tsx
          git commit -m "fix: remove per-punch cumulative balance display"
          git push
