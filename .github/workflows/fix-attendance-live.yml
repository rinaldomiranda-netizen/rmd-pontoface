name: Fix dashboard mobile menu and loading flicker

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply dashboard fixes
        shell: python
        run: |
          from pathlib import Path
          import re

          p = Path('src/pages/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')

          # Mobile menu: keep only a compact hamburger button visible. The
          # complete navigation opens only when the user taps it.
          if "const [mobileMenuOpen, setMobileMenuOpen]" not in s:
              s = s.replace(
                  "  const [section, setSection] = React.useState<Section>('overview');",
                  "  const [section, setSection] = React.useState<Section>('overview');\n  const [mobileMenuOpen, setMobileMenuOpen] = React.useState(false);",
                  1
              )

          s = s.replace(
              "{section === 'overview' ? <div className=\"mobile-nav\">{nav}</div> : <div className=\"mobile-nav-back\"><button className=\"btn light wide\" onClick={() => setSection('overview')}>← Voltar ao menu</button></div>}",
              "{section === 'overview' ? (\n            <div className=\"mobile-nav\">\n              <button className=\"mobile-menu-trigger\" aria-label=\"Abrir menu do dashboard\" aria-expanded={mobileMenuOpen} onClick={() => setMobileMenuOpen(v => !v)}>☰ <span>Menu</span></button>\n              {mobileMenuOpen && <div className=\"mobile-menu-popover\" onClick={() => setMobileMenuOpen(false)}>{nav}</div>}\n            </div>\n          ) : <div className=\"mobile-nav-back\"><button className=\"btn light wide\" onClick={() => setSection('overview')}>← Voltar ao menu</button></div>}",
              1
          )

          # Returning to Dashboard must never replace the KPI area with the
          # word "Carregando...". Keep the last/cached values visible while the
          # asynchronous refresh runs in the background.
          s = s.replace(
              "  if (loading) return <p className=\"empty-row\">Carregando...</p>;\n  return (",
              "  return (",
              1
          )

          # The cache is already used to initialize stats; keep loading only as
          # an internal flag for compatibility, never as a visual gate.
          p.write_text(s, encoding='utf-8')

          css = Path('src/styles.css')
          c = css.read_text(encoding='utf-8')
          c = c.replace(
              ".mobile-nav{display:none;}\n.mobile-nav-toggle{display:none;}",
              ".mobile-nav{display:none;}\n.mobile-nav-toggle{display:none;}\n.mobile-menu-trigger{display:none;}\n.mobile-menu-popover{display:none;}",
              1
          )
          c = c.replace(
              "  .mobile-nav{display:flex;flex-direction:column;gap:6px;margin-bottom:18px;}\n  .mobile-nav button{width:100%;text-align:left;background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:13px 16px;font-size:14px;font-weight:700;}\n  .mobile-nav button.active{background:var(--brand-2);color:#fff;border-color:var(--brand-2);}",
              "  .mobile-nav{display:block;position:relative;margin-bottom:14px;}\n  .mobile-menu-trigger{display:inline-flex;align-items:center;gap:9px;background:var(--surface);border:1px solid var(--border);border-radius:12px;padding:11px 15px;color:var(--text);font-size:14px;font-weight:800;box-shadow:0 2px 8px rgba(16,47,36,.06);}\n  .mobile-menu-popover{display:flex;flex-direction:column;gap:5px;position:absolute;left:0;right:0;top:calc(100% + 7px);z-index:20;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:8px;box-shadow:0 12px 30px rgba(16,47,36,.16);}\n  .mobile-menu-popover button{width:100%;text-align:left;background:transparent;border:0;border-radius:9px;padding:12px 13px;color:var(--text);font-size:14px;font-weight:700;}\n  .mobile-menu-popover button.active{background:var(--brand-2);color:#fff;}",
              1
          )
          css.write_text(c, encoding='utf-8')
      - name: Commit patch
        shell: bash
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx src/styles.css
          git commit -m "fix: compact mobile menu and remove dashboard loading flicker"
          git push
