name: Patch attendance balance

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch attendance UI
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('src/pages/AdminDashboard.tsx')
          s = p.read_text(encoding='utf-8')
          marker = '  // FIX_PARTIAL_BALANCE_V2\n'

          if marker in s:
              print('Attendance patch already applied.')
              raise SystemExit(0)

          needle = "  const canReset = ['owner', 'admin', 'hr'].includes(role);\n"
          if needle not in s:
              raise SystemExit('Attendance state marker not found.')
          s = s.replace(needle, needle + "\n" + marker + "  const firstAttendanceLoadRef = React.useRef(true);\n", 1)

          old = """  async function load() {
    setLoading(true);
    const start = new Date(date + 'T00:00:00');"""
          new = """  async function load() {
    const isInitialLoad = firstAttendanceLoadRef.current;
    if (isInitialLoad) setLoading(true);
    const start = new Date(date + 'T00:00:00');"""
          if old not in s:
              raise SystemExit('Attendance load start not found.')
          s = s.replace(old, new, 1)

          old = """    setRows(dayRows || []);
    setEmployees(empRows || []);
    setSchedules(schedRows || []);
    setAlerts(alertRows || []);
    setAllRecords(historyRows || []);
    setLoading(false);
  }"""
          new = """    setRows(dayRows || []);
    setEmployees(empRows || []);
    setSchedules(schedRows || []);
    setAlerts(alertRows || []);
    setAllRecords(historyRows || []);
    if (isInitialLoad) {
      firstAttendanceLoadRef.current = false;
      setLoading(false);
    }
  }"""
          if old not in s:
              raise SystemExit('Attendance load end not found.')
          s = s.replace(old, new, 1)

          old = """    for (const r of lastByDay.values()) {
      if (map.has(r.employee_id)) map.get(r.employee_id).totalBalance += Number(r.balance_minutes || 0);
    }
    return [...map.values()].sort((a,b) => String(a.employee.full_name).localeCompare(String(b.employee.full_name)));"""
          new = """    for (const r of lastByDay.values()) {
      if (!map.has(r.employee_id)) continue;
      const dayKey = new Intl.DateTimeFormat('en-CA', { timeZone: 'America/Sao_Paulo' }).format(new Date(r.occurred_at));
      const item = map.get(r.employee_id);
      const maxForSelectedDay = item.schedule?.afternoon_enabled === true ? 4 : (item.schedule?.enabled === false ? 0 : 2);
      const incompleteSelectedDay = dayKey === date && maxForSelectedDay > 0 && item.rows.length < maxForSelectedDay;
      if (!incompleteSelectedDay) item.totalBalance += Number(r.balance_minutes || 0);
    }

    for (const item of map.values()) {
      const maxForSelectedDay = item.schedule?.afternoon_enabled === true ? 4 : (item.schedule?.enabled === false ? 0 : 2);
      if (maxForSelectedDay > 0 && item.rows.length < maxForSelectedDay) {
        const entryAlert = item.alerts.find((a: any) =>
          /entrada/i.test(String(a.message || '')) && /após|antes|atrasad|adiantad/i.test(String(a.message || '')) && a.minutes_delta != null
        );
        if (entryAlert) item.totalBalance += -Number(entryAlert.minutes_delta || 0);
      }
    }
    return [...map.values()].sort((a,b) => String(a.employee.full_name).localeCompare(String(b.employee.full_name)));"""
          if old not in s:
              raise SystemExit('Attendance accumulated balance block not found.')
          s = s.replace(old, new, 1)

          old = """          const balance = item.rows.length ? Number(item.rows[item.rows.length-1].balance_minutes || 0) : 0;
          const completed = item.rows.length;
          const maxToday = item.schedule?.afternoon_enabled === true ? 4 : (item.schedule?.enabled === false ? 0 : 2);"""
          new = """          const completed = item.rows.length;
          const maxToday = item.schedule?.afternoon_enabled === true ? 4 : (item.schedule?.enabled === false ? 0 : 2);
          const dayComplete = maxToday > 0 && completed >= maxToday;
          const entryAlert = item.alerts.find((a:any) =>
            /entrada/i.test(String(a.message || '')) && /após|antes|atrasad|adiantad/i.test(String(a.message || '')) && a.minutes_delta != null
          );
          const balance = dayComplete
            ? Number(item.rows[item.rows.length-1]?.balance_minutes || 0)
            : (entryAlert ? -Number(entryAlert.minutes_delta || 0) : 0);"""
          if old not in s:
              raise SystemExit('Attendance day balance block not found.')
          s = s.replace(old, new, 1)

          old = """                <div style={{fontWeight:800,color:balance<0?'var(--danger)':balance>0?'var(--brand-2)':'inherit'}}>
                  Saldo do dia: {balance>0?'+':''}{balance} min
                </div>"""
          new = """                <div style={{fontWeight:800,color:balance<0?'var(--danger)':balance>0?'var(--brand-2)':'inherit'}}>
                  {dayComplete ? 'Saldo do dia' : (balance < 0 ? 'Atraso registrado' : balance > 0 ? 'Adiantamento registrado' : 'Saldo do dia')}: {balance>0?'+':''}{Math.round(balance)} min
                </div>"""
          if old not in s:
              raise SystemExit('Attendance balance display block not found.')
          s = s.replace(old, new, 1)

          p.write_text(s, encoding='utf-8')
          print('Attendance patch applied.')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/pages/AdminDashboard.tsx
          git commit -m "fix: show only actual attendance balance during day"
          git push
