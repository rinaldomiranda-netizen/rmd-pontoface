AWSTemplateFormatVersion: '2010-09-09'
Description: RMD PontoFace - Cognito Identity Pool permission used only to sign Rekognition Face Liveness streaming requests.
Resources:
  IdentityPool:
    Type: AWS::Cognito::IdentityPool
    Properties:
      IdentityPoolName: rmd-pontoface-liveness
      AllowUnauthenticatedIdentities: true
  UnauthenticatedRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: rmd-pontoface-liveness-unauth
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Federated: cognito-identity.amazonaws.com
            Action: sts:AssumeRoleWithWebIdentity
            Condition:
              StringEquals:
                cognito-identity.amazonaws.com:aud: !Ref IdentityPool
              ForAnyValue:StringLike:
                cognito-identity.amazonaws.com:amr: unauthenticated
      Policies:
        - PolicyName: StartOnly
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - rekognition:StartFaceLivenessSession
                Resource: '*'
  IdentityPoolRoleAttachment:
    Type: AWS::Cognito::IdentityPoolRoleAttachment
    Properties:
      IdentityPoolId: !Ref IdentityPool
      Roles:
        unauthenticated: !GetAtt UnauthenticatedRole.Arn
Outputs:
  IdentityPoolId:
    Value: !Ref IdentityPool
  Region:
    Value: !Ref AWS::Region
